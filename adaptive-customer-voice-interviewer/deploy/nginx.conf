map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cvi_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Base64 audio uploads are capped at 25 MB in the API.
    client_max_body_size 30m;

    root /usr/share/cvi/frontend;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(style\.css|app\.js|theme\.js|audio-worklet\.js)$ {
        try_files $uri =404;
    }

    # Everything else goes to FastAPI. In particular /researcher* must not be
    # served statically, or the Basic-auth middleware would be bypassed.
    location / {
        proxy_pass http://cvi_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
