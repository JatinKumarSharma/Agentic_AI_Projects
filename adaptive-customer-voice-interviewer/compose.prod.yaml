services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cvi_research}
      POSTGRES_USER: ${POSTGRES_USER:-cvi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-cvi} -d ${POSTGRES_DB:-cvi_research}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db-bootstrap:
    build:
      context: .
      target: runtime
    image: cvi:local
    command: ["python", "-m", "scripts.bootstrap_postgres_roles"]
    environment:
      CVI_MIGRATION_DATABASE_URL: ${CVI_MIGRATION_DATABASE_URL:?CVI_MIGRATION_DATABASE_URL is required in production}
      CVI_MIGRATION_DB_USER: ${CVI_MIGRATION_DB_USER:-}
      CVI_RUNTIME_DB_USER: ${CVI_RUNTIME_DB_USER:-cvi_runtime}
      CVI_RUNTIME_DB_PASSWORD: ${CVI_RUNTIME_DB_PASSWORD:?CVI_RUNTIME_DB_PASSWORD is required in production}
      CVI_BACKUP_DB_USER: ${CVI_BACKUP_DB_USER:-cvi_backup}
      CVI_BACKUP_DB_PASSWORD: ${CVI_BACKUP_DB_PASSWORD:?CVI_BACKUP_DB_PASSWORD is required in production}
      CVI_LOG_FORMAT: json
      CVI_LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    environment:
      CVI_PERSISTENCE_BACKEND: postgresql
      CVI_DATABASE_URL: ${CVI_MIGRATION_DATABASE_URL:?CVI_MIGRATION_DATABASE_URL is required in production}
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully

  api:
    environment:
      CVI_LOG_FORMAT: json
      CVI_LOG_LEVEL: info
      CVI_PERSISTENCE_BACKEND: postgresql
      CVI_DATABASE_URL: ${CVI_RUNTIME_DATABASE_URL:?CVI_RUNTIME_DATABASE_URL is required in production}
      CVI_OLLAMA_BASE_URL: http://ollama:11434
      CVI_WORKER_ENABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    environment:
      CVI_PERSISTENCE_BACKEND: postgresql
      CVI_DATABASE_URL: ${CVI_RUNTIME_DATABASE_URL:?CVI_RUNTIME_DATABASE_URL is required in production}
      CVI_LOG_FORMAT: json
      CVI_LOG_LEVEL: info
      CVI_OLLAMA_BASE_URL: http://ollama:11434
      CVI_WORKER_ENABLED: "1"
      CVI_WORKER_STALE_TIMEOUT_SECONDS: ${CVI_WORKER_STALE_TIMEOUT_SECONDS:-300}
      CVI_WORKER_HEARTBEAT_SECONDS: ${CVI_WORKER_HEARTBEAT_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    environment:
      CVI_PERSISTENCE_BACKEND: postgresql
      CVI_DATABASE_URL: ${CVI_BACKUP_DATABASE_URL:?CVI_BACKUP_DATABASE_URL is required in production}
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully

  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/letsencrypt:ro
      - ./frontend:/usr/share/cvi/frontend:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pg-data:
