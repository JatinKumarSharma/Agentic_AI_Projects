# Free, no-domain CVI demo on Render + Neon.
# Create the Blueprint from adaptive-customer-voice-interviewer/render.yaml.
# Secrets are entered in the Render dashboard; never commit them here.
services:
  - type: web
    name: cvi-portfolio
    runtime: docker
    plan: free
    region: oregon
    rootDir: adaptive-customer-voice-interviewer
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health/ready
    envVars:
      - key: CVI_PERSISTENCE_BACKEND
        value: postgresql
      - key: CVI_DATABASE_URL
        sync: false
      - key: CVI_TENANT_ID
        value: cvi-portfolio
      - key: CVI_LLM_PROVIDER
        value: groq
      - key: CVI_LLM_STRUCTURED_METHOD
        value: function_calling
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: CVI_LLM_MAX_RETRIES
        # Groq free on-demand allows ~1000 output tokens/minute. Structured
        # nodes can request ~750, so let the SDK honour short Retry-After
        # values instead of failing the participant turn on a 429.
        value: "2"
      - key: CVI_LLM_MAX_OUTPUT_TOKENS
        # Keep each structured request small enough that a whole interview
        # turn fits inside the shared free-tier output budget.
        value: "400"
      - key: CVI_LLM_RATE_LIMIT_RETRIES
        # Application-level 429 handling at the LLM boundary. The SDK retry
        # budget can be exhausted during a burst of structured calls.
        value: "3"
      - key: CVI_LLM_RATE_LIMIT_MAX_DELAY_SECONDS
        # Honour Groq's Retry-After without letting a daily-quota response
        # hang the participant turn.
        value: "25"
      - key: CVI_LLM_REQUEST_TIMEOUT
        value: "12"
      - key: RESEARCHER_ACCESS_CODE
        sync: false
      - key: CVI_WORKER_ENABLED
        value: "1"
      - key: CVI_VOICE_LANGUAGE
        value: en-IN
      - key: CVI_VOICE_STT_PROVIDER
        value: browser_speech
      - key: CVI_VOICE_STT_FALLBACKS
        value: local,typed
      - key: CVI_VOICE_TTS_PROVIDER
        value: browser
      - key: CVI_VOICE_TTS_FALLBACKS
        value: browser
      - key: CVI_LOCAL_STT_URL
        value: http://127.0.0.1:9000/transcribe
      - key: CVI_LOCAL_STT_LANGUAGE
        value: en-IN
      - key: CVI_SPEECH_URL
        value: http://127.0.0.1:9000
      - key: CVI_SPEECH_STREAM_URL
        value: ws://127.0.0.1:9000/stream
      - key: CVI_SPEECH_STT_ENGINE
        # Avoid direct Groq STT from Render egress; 403/1010 blocks can occur.
        # Use small local Whisper on the free demo; typed fallback remains.
        value: faster-whisper
      - key: CVI_LOCAL_STT_MODEL
        value: tiny.en
      - key: CVI_LOCAL_STT_DEVICE
        value: cpu
      - key: CVI_LOCAL_STT_COMPUTE_TYPE
        value: int8
      - key: CVI_LOCAL_STT_CPU_THREADS
        value: "1"
      - key: CVI_LOCAL_STT_NUM_WORKERS
        value: "1"
      - key: CVI_LOCAL_STT_BEAM_SIZE
        value: "1"
      - key: CVI_LOCAL_STT_VAD_FILTER
        value: "false"
      - key: CVI_LOCAL_STT_WITHOUT_TIMESTAMPS
        value: "true"
      - key: CVI_LOCAL_STT_CONDITION_ON_PREVIOUS_TEXT
        value: "false"
      - key: CVI_LOCAL_STT_MAX_AUDIO_SECONDS
        value: "12"
      - key: CVI_SPEECH_STT_ENABLED
        value: "true"
      - key: CVI_SPEECH_TTS_ENABLED
        value: "false"
      - key: CVI_SPEECH_VAD_PROVIDER
        value: energy
      - key: CVI_SPEECH_END_SILENCE_MS
        value: "900"
      - key: CVI_SPEECH_MIN_SEGMENT_MS
        value: "500"
      - key: CVI_SPEECH_VAD_THRESHOLD
        value: "250"
      - key: CVI_SPEECH_EMIT_AUDIO_SEGMENTS
        value: "false"
      - key: CVI_DEMO_LINK_TTL_MINUTES
        value: "15"
      - key: CVI_RATE_LIMIT_DEMO_PER_MINUTE
        value: "6"
      - key: CVI_LOG_FORMAT
        value: json
      - key: CVI_LOG_LEVEL
        value: info
